name: Profile Metrics

on:
  schedule:
    - cron: '30 3 * * *'  # 09:00 IST (UTC+5:30) daily
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: 0xDevNinja
          template: classic
          config_timezone: UTC
          # Drop "joined GitHub on..." + "followers · following" from header
          base: "activity, community, repositories, metadata"
          plugin_languages: yes
          plugin_languages_limit: 6
