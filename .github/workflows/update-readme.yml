name: Update README

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3,15 * * *'  # 09:00 + 21:00 IST (UTC+5:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Skip bot's own commits to prevent infinite loop
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Refresh dynamic sections
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: bash .github/scripts/update-readme.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(readme): refresh dynamic sections"
            git push
          fi
